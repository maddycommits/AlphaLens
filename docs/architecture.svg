<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 860" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#455a64"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a73e8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1140" height="860" fill="#ffffff"/>
  <text x="24" y="34" font-size="20" font-weight="700" fill="#202124">AlphaLens — High-Level Architecture (V1)</text>
  <text x="24" y="54" font-size="11.5" fill="#5f6368">Spring Boot 3.5 / Java 21 · Kafka · PostgreSQL · Redis · Spring AI</text>

  <!-- User -->
  <rect x="510" y="20" width="120" height="40" rx="20" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.5"/>
  <text x="570" y="45" font-size="14" font-weight="600" text-anchor="middle" fill="#202124">User</text>

  <!-- Angular -->
  <rect x="460" y="100" width="220" height="46" rx="8" fill="#fce8e6" stroke="#d93025" stroke-width="1.5"/>
  <text x="570" y="128" font-size="14" font-weight="600" text-anchor="middle" fill="#202124">Angular Web App</text>

  <!-- Gateway -->
  <rect x="430" y="190" width="280" height="58" rx="8" fill="#e6f4ea" stroke="#188038" stroke-width="1.5"/>
  <text x="570" y="213" font-size="14" font-weight="600" text-anchor="middle" fill="#202124">api-gateway</text>
  <text x="570" y="232" font-size="11" text-anchor="middle" fill="#5f6368">Spring Cloud Gateway · JWT · rate limiting</text>

  <!-- User -> Angular -> Gateway -->
  <line x1="570" y1="60" x2="570" y2="97" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="570" y1="146" x2="570" y2="187" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- reference-data & watchlist -->
  <rect x="230" y="300" width="250" height="74" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
  <text x="355" y="323" font-size="13.5" font-weight="600" text-anchor="middle" fill="#202124">reference-data-service</text>
  <text x="355" y="341" font-size="11" text-anchor="middle" fill="#5f6368">company master data</text>
  <text x="355" y="356" font-size="11" text-anchor="middle" fill="#5f6368">market-cap classification · PostgreSQL</text>

  <rect x="660" y="300" width="250" height="74" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
  <text x="785" y="323" font-size="13.5" font-weight="600" text-anchor="middle" fill="#202124">watchlist-service</text>
  <text x="785" y="341" font-size="11" text-anchor="middle" fill="#5f6368">user watchlists (CRUD)</text>
  <text x="785" y="356" font-size="11" text-anchor="middle" fill="#5f6368">PostgreSQL</text>

  <!-- Gateway -> services -->
  <line x1="500" y1="248" x2="380" y2="297" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="640" y1="248" x2="760" y2="297" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- watchlist -> kafka -->
  <line x1="785" y1="374" x2="785" y2="427" stroke="#1a73e8" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <text x="795" y="405" font-size="10.5" fill="#1a73e8">watchlist.events.v1</text>

  <!-- Kafka bus -->
  <rect x="120" y="430" width="900" height="52" rx="6" fill="#263238" stroke="#000000" stroke-width="1"/>
  <text x="570" y="452" font-size="15" font-weight="700" text-anchor="middle" fill="#ffffff">Apache Kafka</text>
  <text x="570" y="470" font-size="11" text-anchor="middle" fill="#b0bec5">event backbone — new capabilities attach as new consumers</text>

  <!-- ===== bottom services ===== -->
  <!-- market-data -->
  <rect x="120" y="565" width="210" height="88" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
  <text x="225" y="588" font-size="13" font-weight="600" text-anchor="middle" fill="#202124">market-data-service</text>
  <text x="225" y="606" font-size="10.5" text-anchor="middle" fill="#5f6368">polls NSE/BSE prices</text>
  <text x="225" y="621" font-size="10.5" text-anchor="middle" fill="#5f6368">computes % change vs close</text>
  <text x="225" y="636" font-size="10.5" text-anchor="middle" fill="#5f6368">PostgreSQL (EOD history)</text>

  <!-- movement-detector -->
  <rect x="350" y="565" width="210" height="88" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
  <text x="455" y="588" font-size="13" font-weight="600" text-anchor="middle" fill="#202124">movement-detector</text>
  <text x="455" y="606" font-size="10.5" text-anchor="middle" fill="#5f6368">threshold rules per cap band</text>
  <text x="455" y="621" font-size="10.5" text-anchor="middle" fill="#5f6368">large &gt;2% · mid &gt;3% · small &gt;4%</text>
  <text x="455" y="636" font-size="10.5" text-anchor="middle" fill="#5f6368">daily dedupe · Redis</text>

  <!-- insight -->
  <rect x="580" y="565" width="210" height="88" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
  <text x="685" y="588" font-size="13" font-weight="600" text-anchor="middle" fill="#202124">insight-service</text>
  <text x="685" y="606" font-size="10.5" text-anchor="middle" fill="#5f6368">news fetch + relevance filter</text>
  <text x="685" y="621" font-size="10.5" text-anchor="middle" fill="#5f6368">Claude explains the move</text>
  <text x="685" y="636" font-size="10.5" text-anchor="middle" fill="#5f6368">Spring AI · PostgreSQL</text>

  <!-- notification -->
  <rect x="810" y="565" width="210" height="88" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
  <text x="915" y="588" font-size="13" font-weight="600" text-anchor="middle" fill="#202124">notification-service</text>
  <text x="915" y="606" font-size="10.5" text-anchor="middle" fill="#5f6368">in-app feed (WebSocket/SSE)</text>
  <text x="915" y="621" font-size="10.5" text-anchor="middle" fill="#5f6368">email / Telegram</text>
  <text x="915" y="636" font-size="10.5" text-anchor="middle" fill="#5f6368">PostgreSQL</text>

  <!-- kafka <-> market-data -->
  <line x1="155" y1="482" x2="155" y2="562" stroke="#1a73e8" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <line x1="295" y1="562" x2="295" y2="485" stroke="#1a73e8" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <text x="225" y="512" font-size="10" text-anchor="middle" fill="#1a73e8">▼ watchlist.events.v1</text>
  <text x="225" y="528" font-size="10" text-anchor="middle" fill="#1a73e8">▲ price.ticks.v1</text>

  <!-- kafka <-> movement-detector -->
  <line x1="385" y1="482" x2="385" y2="562" stroke="#1a73e8" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <line x1="525" y1="562" x2="525" y2="485" stroke="#1a73e8" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <text x="455" y="512" font-size="10" text-anchor="middle" fill="#1a73e8">▼ price.ticks.v1</text>
  <text x="455" y="528" font-size="10" text-anchor="middle" fill="#1a73e8">▲ movement.detected.v1</text>

  <!-- kafka <-> insight -->
  <line x1="615" y1="482" x2="615" y2="562" stroke="#1a73e8" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <line x1="755" y1="562" x2="755" y2="485" stroke="#1a73e8" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <text x="685" y="512" font-size="10" text-anchor="middle" fill="#1a73e8">▼ movement.detected.v1</text>
  <text x="685" y="528" font-size="10" text-anchor="middle" fill="#1a73e8">▲ insight.generated.v1</text>

  <!-- kafka -> notification -->
  <line x1="915" y1="482" x2="915" y2="562" stroke="#1a73e8" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <text x="915" y="512" font-size="10" text-anchor="middle" fill="#1a73e8">▼ movement.detected.v1</text>
  <text x="915" y="528" font-size="10" text-anchor="middle" fill="#1a73e8">▼ insight.generated.v1</text>

  <!-- externals -->
  <rect x="130" y="720" width="190" height="48" rx="24" fill="#f1f3f4" stroke="#9aa0a6" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="225" y="741" font-size="12" font-weight="600" text-anchor="middle" fill="#3c4043">NSE / BSE</text>
  <text x="225" y="757" font-size="10.5" text-anchor="middle" fill="#5f6368">price data</text>
  <line x1="225" y1="720" x2="225" y2="656" stroke="#9aa0a6" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow)"/>

  <rect x="545" y="720" width="130" height="48" rx="24" fill="#f1f3f4" stroke="#9aa0a6" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="610" y="741" font-size="12" font-weight="600" text-anchor="middle" fill="#3c4043">News APIs</text>
  <text x="610" y="757" font-size="10.5" text-anchor="middle" fill="#5f6368">RSS feeds</text>
  <line x1="630" y1="720" x2="650" y2="656" stroke="#9aa0a6" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow)"/>

  <rect x="695" y="720" width="150" height="48" rx="24" fill="#f3e8fd" stroke="#a142f4" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="770" y="741" font-size="12" font-weight="600" text-anchor="middle" fill="#3c4043">Anthropic Claude</text>
  <text x="770" y="757" font-size="10.5" text-anchor="middle" fill="#5f6368">LLM insights</text>
  <line x1="750" y1="720" x2="722" y2="656" stroke="#a142f4" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow)"/>

  <!-- notification -> user -->
  <path d="M 1020 609 L 1085 609 L 1085 40 L 634 40" fill="none" stroke="#f9ab00" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="1097" y="330" font-size="10.5" fill="#b06000" transform="rotate(-90 1097 330)" text-anchor="middle">WebSocket / SSE · email · Telegram</text>

  <text x="24" y="840" font-size="10.5" fill="#9aa0a6">Database-per-service · Future (Phase 3+): order-service and momentum-strategy-service attach to price.ticks / insight.generated topics — no re-architecture.</text>
</svg>
